[package]
name = "rwkv-prompt-format"
version = "0.1.0"
edition = "2024"
description = "RWKV G1/G1x prompt format checker and auto-fixer (Rust lib + JSON CLI + C ABI)"
license = "MIT OR Apache-2.0"
keywords = ["rwkv", "prompt", "format", "linter"]
categories = ["development-tools", "text-processing"]

[lib]
name = "rwkv_prompt_format"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "rwkv-pf"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
clap = { version = "4.6", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"

# WASM 体积优先；构建命令会显式指定该 profile。
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
